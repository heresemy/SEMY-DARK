<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, shrink-to-fit=no, viewport-fit=cover">
  <title>NumApis Checker | SEMY</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 50%, #0a0e1a 100%);
      font-family: 'Share Tech Mono', 'Courier New', 'Fira Code', monospace;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .header {
      text-align: center;
      padding: 30px 20px;
      background: rgba(10, 20, 30, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 0, 0.3);
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.1);
      margin-bottom: 30px;
    }
    .developer-name {
      font-size: 2.8rem;
      font-weight: bold;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px rgba(0, 255, 136, 0.3); }
      to { text-shadow: 0 0 20px rgba(0, 255, 136, 0.6); }
    }
    .city-name {
      font-size: 1.1rem;
      color: #88ffaa;
      margin-top: 8px;
      letter-spacing: 2px;
      opacity: 0.8;
    }
    .city-name::before {
      content: "📍 ";
      color: #ff6666;
    }
    .search-card {
      background: rgba(5, 10, 20, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 0, 0.4);
      padding: 30px 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .terminal-prompt {
      color: #00ff88;
      font-size: 0.9rem;
      margin-bottom: 15px;
      font-family: monospace;
    }
    .terminal-prompt::before {
      content: "$> ";
      color: #ffaa44;
    }
    .input-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .number-input, .pin-input {
      flex: 1;
      background: #0a0f1e;
      border: 2px solid #1a2a3a;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-family: 'Share Tech Mono', monospace;
      color: #00ffaa;
      outline: none;
      transition: all 0.3s ease;
    }
    .number-input:focus, .pin-input:focus {
      border-color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
    }
    .number-input::placeholder, .pin-input::placeholder {
      color: #3a4a5a;
      font-family: monospace;
    }
    .pin-input {
      flex: 0.5;
      min-width: 120px;
    }
    .search-btn {
      background: linear-gradient(135deg, #00aa55, #008844);
      border: none;
      border-radius: 12px;
      padding: 14px 30px;
      font-size: 1rem;
      font-weight: bold;
      font-family: monospace;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      width: 100%;
    }
    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
      background: linear-gradient(135deg, #00cc66, #00aa55);
    }
    .pin-hint {
      color: #ffaa44;
      font-size: 0.75rem;
      margin-top: 10px;
      text-align: center;
      opacity: 0.7;
    }
    .result-card {
      background: rgba(5, 10, 20, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 0, 0.4);
      padding: 25px;
      margin-top: 20px;
    }
    .error-header {
      color: #ff5555;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .not-found-header {
      color: #ffaa44;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .success-header {
      color: #00ff88;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 255, 136, 0.3);
    }
    .record-count {
      background: #0a1a1a;
      padding: 8px 15px;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #00ffaa;
      display: inline-block;
      margin-bottom: 20px;
    }
    .record-item {
      background: rgba(15, 25, 35, 0.6);
      border-left: 4px solid #00ff88;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .record-item:hover {
      background: rgba(20, 35, 45, 0.8);
      transform: translateX(5px);
    }
    .record-title {
      color: #ffcc44;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .detail-row {
      display: flex;
      flex-wrap: wrap;
      margin: 8px 0;
      font-size: 0.9rem;
    }
    .detail-label {
      width: 130px;
      color: #88aaff;
      font-weight: bold;
    }
    .detail-value {
      flex: 1;
      color: #ccddff;
      word-break: break-word;
    }
    .badge {
      background: #1a2a3a;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      color: #88ffaa;
    }
    .search-again-btn {
      background: transparent;
      border: 2px solid #00ff88;
      border-radius: 30px;
      padding: 10px 25px;
      font-family: monospace;
      color: #00ff88;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .search-again-btn:hover {
      background: #00ff8822;
      transform: scale(1.02);
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #3a5a6a;
      font-size: 0.8rem;
    }
    .glitch-text {
      position: relative;
      animation: glitch 3s infinite;
    }
    @keyframes glitch {
      0%, 100% { text-shadow: none; }
      95% { text-shadow: none; }
      96% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; }
      97% { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
    }
    @media (max-width: 600px) {
      .developer-name { font-size: 2rem; }
      .input-group { flex-direction: column; }
      .detail-label { width: 100px; font-size: 0.8rem; }
      .detail-value { font-size: 0.8rem; }
      .pin-input { width: 100%; }
    }
    .lock-icon {
      display: inline-block;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="developer-name glitch-text">SEMY</div>
      <div class="city-name">CITY: PICHHORE</div>
      <div style="font-size: 0.7rem; color: #44aa77; margin-top: 8px;">// DARK DATA EXTRACTOR //</div>
    </div>

    <div class="search-card">
      <div class="terminal-prompt">
        <span class="lock-icon">🔒</span> enter mobile number &amp; access PIN
      </div>
      <form id="searchForm" onsubmit="return handleSearch(event)">
        <div class="input-group">
          <input type="tel" id="numberInput" name="number" class="number-input" placeholder="📱 Mobile Number" maxlength="10" pattern="[0-9]{10}" required autofocus>
        </div>
        <div class="input-group">
          <input type="password" id="pinInput" name="pin" class="pin-input" placeholder="🔑 PIN CODE" maxlength="4" pattern="[0-9]{4}" required>
        </div>
        <div class="pin-hint">
          ⚡ Enter 4-digit PIN to access database ⚡
        </div>
        <button type="submit" id="searchButton" class="search-btn">
          🔓 UNLOCK &amp; SEARCH 🔍
        </button>
      </form>
    </div>

    <!-- Dynamic result area -->
    <div id="resultContainer"></div>

    <div class="footer">
      ⚡ DEVELOPER SEMY v1.0 | SECURE SYSTEM ⚡
    </div>
  </div>

  <script>
    (function() {
      // ----- PROTECTED NUMBER : 8815743146 -----
      const PROTECTED_NUMBER = "8815743146";
      
      // Sample database for demonstration (all numbers except protected one)
      const SAMPLE_DB = [
        { name: "YOUR FATHER", father_name: "YOUR FATHER", mobile: "8815743176", alternate_number: "8815743146", aadhaar: "1234-5678-9012", address: "YOUR FATHER", circle: "MP" },
        { name: "YOUR FATHER", father_name: "YOUR FATHER", mobile: "8815743146", alternate_number: "8815743146", aadhaar: "2345-6789-0123", address: "PAPAJI", circle: "MP" }
      ];

      function getFormattedTimestamp() {
        const now = new Date();
        return now.toLocaleString('en-IN', { hour12: false, timeZone: 'Asia/Kolkata' });
      }

      function showResultUI(htmlContent) {
        const container = document.getElementById('resultContainer');
        if (container) {
          container.innerHTML = htmlContent;
        }
      }

      function buildErrorHtml(message) {
        return `
          <div class="result-card">
            <div class="error-header">
              <span>🥴</span> ERROR FOUND
            </div>
            <div style="color: #ff8888; padding: 10px 0;">
              ${escapeHtml(message)}
            </div>
            <div style="margin-top: 20px; color: #ffaa66; font-size: 0.85rem;">
              ⚠️ Please try after some time
            </div>
          </div>
        `;
      }

      function buildNotFoundHtml(queriedNumber) {
        return `
          <div class="result-card">
            <div class="not-found-header">
              <span>🔍</span> NO DATA FOUND
            </div>
            <div style="color: #ffaa66; padding: 15px 0;">
              ⚠️ No records associated with this number
            </div>
            <div style="color: #6688aa; font-size: 0.85rem;">
              🔢 Number: ${escapeHtml(queriedNumber)}
            </div>
            <button class="search-again-btn" onclick="resetSearchForm()">
              🔍 SEARCH AGAIN
            </button>
          </div>
        `;
      }

      function buildFoundHtml(records, queriedNumber) {
        const timestamp = getFormattedTimestamp();
        let recordsHtml = '';
        records.forEach((record, idx) => {
          recordsHtml += `
            <div class="record-item">
              <div class="record-title">
                RECORD ${idx + 1}
                <span class="badge">${escapeHtml(record.circle || 'UNKNOWN')}</span>
              </div>
              <div class="detail-row">
                <div class="detail-label">👤 NAME:</div>
                <div class="detail-value">${escapeHtml(record.name || 'N/A')}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">👪 FATHER:</div>
                <div class="detail-value">${escapeHtml(record.father_name || 'N/A')}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">📱 MOBILE:</div>
                <div class="detail-value">${escapeHtml(record.mobile || 'N/A')}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">🔄 2 NUMBER:</div>
                <div class="detail-value">${escapeHtml(record.alternate_number || 'N/A')}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">🆔 AADHAAR:</div>
                <div class="detail-value">${escapeHtml(record.aadhaar || 'N/A')}</div>
              </div>
              <div class="detail-row">
                <div class="detail-label">📍 ADDRESS:</div>
                <div class="detail-value">${escapeHtml((record.address || 'N/A').replace(/!/g, ', '))}</div>
              </div>
            </div>
          `;
        });

        return `
          <div class="result-card">
            <div class="success-header">
              <span>✅</span> DATA FOUND SUCCESSFULLY
            </div>
            <div class="record-count">
              📁 RECORDS FOUND : ${records.length}
            </div>
            <div style="margin-bottom: 15px; font-size: 0.8rem; color: #88aacc;">
              <span>🔢 Queried: ${escapeHtml(queriedNumber)}</span>
              <span style="margin-left: 15px;">🕒 ${escapeHtml(timestamp)}</span>
            </div>
            ${recordsHtml}
            <button class="search-again-btn" onclick="resetSearchForm()">
              🔄 SEARCH OTHER NUMBER
            </button>
          </div>
        `;
      }

      // Simple escape to prevent XSS
      function escapeHtml(text) {
        if (!text) return '';
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      window.resetSearchForm = function() {
        const form = document.getElementById('searchForm');
        const numInput = document.getElementById('numberInput');
        const pinInput = document.getElementById('pinInput');
        if (form) form.reset();
        if (numInput) numInput.focus();
        // scroll to top smoothly
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // Optionally clear result
        const container = document.getElementById('resultContainer');
        if (container) container.innerHTML = '';
      };

      window.handleSearch = function(event) {
        event.preventDefault();
        
        const numberInput = document.getElementById('numberInput');
        const pinInput = document.getElementById('pinInput');
        const searchBtn = document.getElementById('searchButton');
        
        if (!numberInput || !pinInput) return false;
        
        const rawNumber = numberInput.value.trim();
        const pin = pinInput.value.trim();
        
        // Basic validation
        if (!/^\d{10}$/.test(rawNumber)) {
          showResultUI(buildErrorHtml("Invalid mobile number. Please enter exactly 10 digits."));
          return false;
        }
        if (!/^\d{4}$/.test(pin)) {
          showResultUI(buildErrorHtml("PIN must be exactly 4 digits."));
          return false;
        }
        
        // ----- PROTECTED NUMBER CHECK : PITA JI KA NUMBER MAT DALO -----
        if (rawNumber === PROTECTED_NUMBER) {
          // Show humorous/restricted message, no data revealed
          showResultUI(buildErrorHtml("PITA JI KA NUMBER MAT DALO 😒"));
          // Reset button state
          if (searchBtn) {
            searchBtn.disabled = false;
            searchBtn.innerHTML = '🔓 UNLOCK &amp; SEARCH 🔍';
          }
          // Clear input for privacy
          if (numberInput) numberInput.value = '';
          if (pinInput) pinInput.value = '';
          return false;
        }
        
        // Simulate search with loading state
        if (searchBtn) {
          searchBtn.disabled = true;
          searchBtn.innerHTML = '🔓 UNLOCKING & SEARCHING ⏳';
        }
        
        // Simulate slight delay for effect
        setTimeout(() => {
          // Search in sample DB (case of demo)
          const foundRecords = SAMPLE_DB.filter(record => record.mobile === rawNumber);
          
          let resultHtml = '';
          if (foundRecords.length > 0) {
            resultHtml = buildFoundHtml(foundRecords, rawNumber);
          } else {
            resultHtml = buildNotFoundHtml(rawNumber);
          }
          
          showResultUI(resultHtml);
          
          // Reset button state
          if (searchBtn) {
            searchBtn.disabled = false;
            searchBtn.innerHTML = '🔓 UNLOCK &amp; SEARCH 🔍';
          }
          
          // Scroll to result
          const container = document.getElementById('resultContainer');
          if (container) {
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 400);
        
        return false; // prevent actual form POST
      };

      // Ensure focus on number input on load
      document.addEventListener('DOMContentLoaded', function() {
        const numField = document.getElementById('numberInput');
        if (numField) numField.focus();
      });

    })();
  </script>
</body>
</html>
